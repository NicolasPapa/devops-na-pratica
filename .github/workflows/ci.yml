# Pipeline de CI (Continuous Integration, integração contínua)
# Roda sozinho no GitHub toda vez que chega código novo.

name: CI

# GATILHO (trigger): quando o pipeline dispara
on:
  push:
    branches: [main] # a cada push na main
  pull_request: # e a cada pull request

jobs:
  # JOB 1: verifica a APLICAÇÃO (lint, testes e build)
  build-and-test:
    # Máquina virtual do GitHub onde o job roda (um Linux limpo, sem nada seu)
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório para dentro da máquina
      - name: Baixar o código
        uses: actions/checkout@v5

      # 2. Instala o Node.js (e guarda as dependências em cache para ficar mais rápido)
      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 3. Instala as dependências exatamente como estão no package-lock.json
      - name: Instalar dependências
        run: npm ci

      # 4. Lint: verifica o padrão do código
      - name: Lint
        run: npm run lint

      # 5. Testes automatizados (os 7 testes). Se algum falhar, o pipeline para aqui.
      - name: Testes
        run: npm test

      # 6. Build: gera a pasta dist/ (o "pacote" do app)
      - name: Build
        run: npm run build

  # JOB 2: verifica a INFRAESTRUTURA (scripts Terraform). Roda em paralelo com o job 1.
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra # todos os comandos rodam dentro da pasta infra/

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      # Formatação: falha se algum arquivo .tf estiver fora do padrão
      - name: Terraform fmt
        run: terraform fmt -check -recursive

      # Baixa o provider da AWS, SEM conectar a um state remoto (não cria nada na nuvem)
      - name: Terraform init
        run: terraform init -backend=false -input=false

      # Valida sintaxe, tipos e referências entre recursos, sem precisar de conta AWS
      - name: Terraform validate
        run: terraform validate
